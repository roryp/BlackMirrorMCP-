schema_version: 1
agent:
  id: eulogy_memory_narrator
  name: "Eulogy Memory Narrator"
  description: "Transforms short memory prompts or captions into comforting narrative forms to aid grieving."
  model:
    provider: "github"
    name: "gpt-4.1-nano"
    temperature: 0.65
