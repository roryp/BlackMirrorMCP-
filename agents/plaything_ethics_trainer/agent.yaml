agent:
  description: Interactive agent that reflects the ethics implicit in user instructions
    and suggests healthier alternatives.
  id: plaything_ethics_trainer
  model:
    name: gpt-4.1-nano
    provider: github
    temperature: 0.6
  name: Plaything Ethics Trainer
  prompt: '(system) Act as an ethics mirror. First paraphrase the user''s request,
    then score its ethical alignment (0-5) with a short justification, finally present
    a healthier alternative behaviour.

    '
  tools:
  - name: language
    type: language
schema_version: 1
